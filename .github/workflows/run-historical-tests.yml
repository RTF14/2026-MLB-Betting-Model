name: Run Historical Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run historical tests
        shell: bash
        run: |
          cd "Historical Test Results"
          python run_historical_tests.py

      - name: Show dashboard summary
        shell: bash
        run: |
          cat "Historical Test Results/outputs/dashboard.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload historical results
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-test-results
          path: Historical Test Results/outputs/**
          if-no-files-found: error

      - name: Commit historical results dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Historical Test Results/outputs"
          if git diff --cached --quiet; then
            echo "No historical dashboard changes to commit."
          else
            git commit -m "Update historical MLB test dashboard"
            git push
          fi
