name: Run Tomorrow's Predictions

on:
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "Prediction date, YYYY-MM-DD. Leave blank for tomorrow UTC."
        required: false
        type: string
  schedule:
    - cron: "0 11 * * *"

jobs:
  run-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tomorrow predictions
        shell: bash
        run: |
          cd "Run Tomorrow's Predictions"
          if [ -n "${{ inputs.prediction_date }}" ]; then
            python run_tomorrow_predictions.py --date "${{ inputs.prediction_date }}"
          else
            python run_tomorrow_predictions.py
          fi

      - name: Upload prediction outputs
        uses: actions/upload-artifact@v4
        with:
          name: mlb-tomorrow-predictions
          path: Run Tomorrow's Predictions/outputs/**
          if-no-files-found: error
