name: Run Tomorrow's Predictions

on:
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "Prediction date, YYYY-MM-DD. Leave blank for tomorrow UTC."
        required: false
        type: string
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  run-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tomorrow predictions
        shell: bash
        run: |
          cd "Run Tomorrow's Predictions"
          if [ -n "${{ inputs.prediction_date }}" ]; then
            python run_tomorrow_predictions.py --date "${{ inputs.prediction_date }}"
          else
            python run_tomorrow_predictions.py
          fi

      - name: Show predictions table in GitHub
        shell: bash
        run: |
          cat "Run Tomorrow's Predictions/latest_predictions.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prediction outputs
        uses: actions/upload-artifact@v4
        with:
          name: mlb-tomorrow-predictions
          path: Run Tomorrow's Predictions/outputs/**
          if-no-files-found: error

      - name: Commit latest predictions table
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Run Tomorrow's Predictions/latest_predictions.md"
          if git diff --cached --quiet; then
            echo "No latest prediction table changes to commit."
          else
            git commit -m "Update latest MLB predictions table"
            git push
          fi
